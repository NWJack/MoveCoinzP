/* ── Web Audio SFX ── */
const AudioFX=(()=>{
  let ctx=null;
  const ens=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx};
  function tone(freq,dur,type='square',vol=.08,slide=0){
    try{const c=ens(),o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);
      if(slide)o.frequency.linearRampToValueAtTime(freq+slide,c.currentTime+dur);
      g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}catch{}
  }
  return{
    jump:()=>tone(280,.08,'square',.07,120),
    doubleJump:()=>{tone(360,.09,'square',.07,180);tone(480,.06,'triangle',.05)},
    coin:()=>{tone(880,.07,'square',.06);setTimeout(()=>tone(1175,.1,'square',.05),50)},
    ultimate:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'sine',.08),i*80))},
    hurt:()=>tone(180,.15,'sawtooth',.08,-80),
    win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.07),i*120))},
    spring:()=>tone(200,.12,'triangle',.07,300),
    stomp:()=>tone(150,.1,'square',.08,-50),
    trophy:()=>{tone(660,.15,'sine',.09);setTimeout(()=>tone(880,.2,'sine',.08),100);setTimeout(()=>tone(1320,.3,'sine',.07),220)}
  };
})();

function parseLevel(ld){
  const map=ld.map,tiles=[],coins=[],spikes=[],springs=[],enemies=[],flags=[],ultimates=[];
  const movers=[],crushers=[],fallers=[],trophies=[],npcs=[],builds=[];
  let spawn={x:2*TILE,y:10*TILE};
  for(let r=0;r<map.length;r++){
    for(let c=0;c<map[r].length;c++){
      const ch=map[r][c],x=c*TILE,y=r*TILE;
      if(ch==='#')tiles.push({x,y,w:TILE,h:TILE});
      else if(ch==='3')spikes.push({x,y:y+TILE-10,w:TILE,h:10});
      else if(ch==='4')coins.push({x:x+8,y:y+8,w:16,h:16,collected:false,anim:Math.random()*6.28});
      else if(ch==='5')flags.push({x,y,w:TILE,h:TILE*2});
      else if(ch==='6')springs.push({x,y:y+TILE-12,w:TILE,h:12});
      else if(ch==='7')enemies.push({x,y,w:28,h:28,vx:1.2,dir:1,alive:true});
      else if(ch==='8')ultimates.push({x:x+4,y:y+4,w:24,h:24,collected:false,anim:Math.random()*6.28});
      else if(ch==='9')spawn={x,y};
      else if(ch==='M')movers.push({x,y,w:TILE*2,h:12,ox:x,range:TILE*3,speed:1.2,dir:1});
      else if(ch==='C')crushers.push({x,y:y-TILE*2,w:TILE,h:TILE,oy:y-TILE*2,range:TILE*3,speed:1.5,dir:1,wait:0});

    function draw(ctx,s){
      const{player:p,level,camera,particles,frame}=s;
      ctx.save();
      const now=new Date();
      const hour=now.getHours()+now.getMinutes()/60;
      if(level.oasis){
        // Day/night sky from real time
        const g=ctx.createLinearGradient(0,0,0,H);
        if(hour>=6&&hour<8){g.addColorStop(0,'#f97316');g.addColorStop(.5,'#fbbf24');g.addColorStop(1,'#0d9488')} // aube

        else if(hour>=17&&hour<20){g.addColorStop(0,'#c2410c');g.addColorStop(.4,'#ea580c');g.addColorStop(1,'#422006')} // crépuscule
        else{g.addColorStop(0,'#0f172a');g.addColorStop(.5,'#1e1b4b');g.addColorStop(1,'#312e81')} // nuit
        ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
        // sun / moon

  const startJukebox=useCallback((trackIdx)=>{
    try{
      if(jukeboxRef.current){try{jukeboxRef.current.stop()}catch{}}
      if(jukeboxSrcRef.current){try{jukeboxSrcRef.current.pause();jukeboxSrcRef.current=null}catch{}}
      const track=TRACKS[trackIdx];
      if(!jukeboxCtxRef.current)jukeboxCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=jukeboxCtxRef.current;
      if(ctx.state==='suspended')ctx.resume();
      const master=ctx.createGain();master.gain.value=0.16;master.connect(ctx.destination);
      const bps=track.bpm/60;
      const intervals=[];
      const scales={harp:[262,294,330,392,523,392,330,294],violin:[196,220,247,294,330,294,247,220],drum:[80,80,120,80,160,80,120,80],guitar:[110,146,165,196,220,196,165,146]};
      const notes=scales[track.vibe]||scales.harp;
      let ni=0;
      const playNote=()=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        const f=notes[ni%notes.length];ni++;
        if(track.vibe==='harp'){o.type='triangle';g.gain.setValueAtTime(0.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.9)}
        else if(track.vibe==='violin'){o.type='sawtooth';g.gain.setValueAtTime(0.04,ctx.currentTime);g.gain.linearRampToValueAtTime(0.08,ctx.currentTime+0.1);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.7)}
        else if(track.vibe==='drum'){
          o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.15);
          g.gain.setValueAtTime(0.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
        }
        else{o.type='triangle';g.gain.setValueAtTime(0.1,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45)}
        if(track.vibe!=='drum')o.frequency.value=f;
        o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+(track.vibe==='drum'?0.22:0.95));
      };
      playNote();
      const step=track.vibe==='drum'?1000/(bps*2):1000/bps;
      intervals.push(setInterval(playNote,step));
      if(track.vibe==='drum'){
        const hat=()=>{
          const buf=ctx.createBuffer(1,ctx.sampleRate*0.05,ctx.sampleRate);
          const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));
          const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=buf;g.gain.value=0.08;src.connect(g);g.connect(master);src.start();
        };
        intervals.push(setInterval(hat,1000/(bps*4)));
      }
      jukeboxRef.current={stop:()=>{intervals.forEach(clearInterval);try{master.disconnect()}catch{}}};
      setJukeboxOn(true);setJukeboxTrack(trackIdx);
    }catch(e){console.error('jukebox',e)}
  },[]);

      {type:'triangle',x:570,y:80,size:50,color:'#ff6b00'},
      {type:'diamond',x:680,y:30,size:55,color:'#00ff94'},
      {type:'circle',x:800,y:55,r:38,color:'#ff2d78'},
      {type:'triangle',x:920,y:45,size:45,color:'#00e5ff'},
      {type:'diamond',x:1040,y:65,size:42,color:'#ffbe00'},
      {type:'circle',x:1160,y:35,r:32,color:'#ff6b00'},
      {type:'triangle',x:1290,y:75,size:55,color:'#7b2fff'},
      {type:'diamond',x:1430,y:40,size:48,color:'#00ff94'},
      {type:'circle',x:1570,y:60,r:36,color:'#ff2d78'},
      {type:'triangle',x:1700,y:30,size:52,color:'#ffbe00'},
      // lower row
      {type:'diamond',x:130,y:145,size:35,color:'#00e5ff'},
      {type:'circle',x:260,y:130,r:28,color:'#ff6b00'},
      {type:'triangle',x:390,y:155,size:38,color:'#00ff94'},
      {type:'diamond',x:520,y:125,size:44,color:'#ff2d78'},
      {type:'circle',x:650,y:140,r:42,color:'#7b2fff'},
      {type:'triangle',x:780,y:150,size:36,color:'#ffbe00'},
      {type:'diamond',x:910,y:130,size:38,color:'#00e5ff'},
      {type:'circle',x:1050,y:145,r:30,color:'#ff2d78'},
      {type:'triangle',x:1180,y:135,size:48,color:'#ff6b00'},
      {type:'diamond',x:1320,y:155,size:40,color:'#7b2fff'},
      {type:'circle',x:1460,y:130,r:35,color:'#00ff94'},
      {type:'triangle',x:1600,y:145,size:42,color:'#ffbe00'},
    ];

    function drawShape(ctx,sh,alpha=1){
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=sh.color;
      if(sh.type==='circle'){ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2);ctx.fill()}
      else if(sh.type==='triangle'){
        const h=sh.size*0.866;
        ctx.beginPath();ctx.moveTo(sh.x,sh.y-sh.size*0.6);ctx.lineTo(sh.x+sh.size/2,sh.y+h*0.4);ctx.lineTo(sh.x-sh.size/2,sh.y+h*0.4);ctx.closePath();ctx.fill();
      }else if(sh.type==='diamond'){
        const s=sh.size/2;
        ctx.beginPath();ctx.moveTo(sh.x,sh.y-s);ctx.lineTo(sh.x+s,sh.y);ctx.lineTo(sh.x,sh.y+s);ctx.lineTo(sh.x-s,sh.y);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }

    // platforms for lounge (with pool edges as walkable surface)
    const plats=[
      [150,420,120],[350,370,100],[600,395,130],
      [TERRACE_X,TERRACE_Y,TERRACE_W], // terrace edge
      [COURT_X,COURT_Y+COURT_H-4,COURT_W], // basketball court floor
    ];

    const loop=()=>{
      wallT+=0.012;
      const me=loungeMeRef.current;
      if(!me){animRef.current=requestAnimationFrame(loop);return;}
      const keys=keysRef.current,touch=touchRef.current;
      let move=0;
      if(keys.ArrowLeft||keys.KeyA||touch.left)move-=1;
      if(keys.ArrowRight||keys.KeyD||touch.right)move+=1;
      me.vx+=move*0.7;me.vx*=0.82;if(Math.abs(me.vx)<0.05)me.vx=0;
      if(move)me.facing=move>0?1:-1;

      const jEdge=jumpBuf.current||touch.jumpEdge;jumpBuf.current=false;touch.jumpEdge=false;
      if(jEdge&&me.onGround){me.vy=-11;me.onGround=false;me.jumpsLeft=1;AudioFX.jump()}
      else if(jEdge&&me.jumpsLeft>0){me.jumpsLeft--;me.vy=-10;AudioFX.doubleJump()}
      me.vy+=0.55;if(me.vy>14)me.vy=14;
      me.x+=me.vx;me.y+=me.vy;
      if(me.x<20)me.x=20;if(me.x>LW-40)me.x=LW-40;

      // Pool swim — slow fall if inside pool horizontally
      const inPool=(me.x+12>POOL_X&&me.x+12<POOL_X+POOL_W&&me.y+28>POOL_Y);
      if(inPool&&me.vy>1.5)me.vy*=0.6;

      // Ground + pool bottom
      const groundHere=inPool?(POOL_Y+POOL_DEPTH-28):GROUND-28;
      if(me.y>=groundHere){me.y=groundHere;me.vy=0;me.onGround=true;me.jumpsLeft=2}
      else me.onGround=false;

      // Platform collisions
      for(const[px,py,pw] of plats){
        if(me.vy>=0&&me.x+24>px&&me.x<px+pw&&me.y+28>=py&&me.y+28<=py+16){
          me.y=py-28;me.vy=0;me.onGround=true;me.jumpsLeft=2;
        }
      }

      const now=Date.now();
      if(now-lastSend>50){lastSend=now;wsSend({type:'lounge_move',x:me.x,y:me.y,facing:me.facing})}

      /* ─── DRAW ─── */
      ctx.save();

      /* 1. Wallpaper background panel (top 200px) */
      // dark base
      ctx.fillStyle='#110e1c';ctx.fillRect(0,0,W,H);

      // Wallpaper rectangle - darker panel with subtle grid
      ctx.fillStyle='#1a1030';ctx.fillRect(0,0,W,195);
      // grid lines
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
      for(let gx=0;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,195);ctx.stroke()}
      for(let gy=0;gy<200;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}

      // parallax stars
      ctx.fillStyle='rgba(255,255,255,0.18)';
      for(let i=0;i<20;i++){ctx.beginPath();ctx.arc((i*113)%W,195+(i*67)%345,1+(i%2)*.5,0,6.28);ctx.fill()}

      // floor tiles (parquet chic)
      const camX=Math.max(0,Math.min(me.x-W/2,LW-W));
      ctx.translate(-Math.floor(camX),0);

      // wall — wallpaper zone scrolls with world
      ctx.fillStyle='#1a1030';ctx.fillRect(0,0,LW,195);
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
      for(let gx=0;gx<LW;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,195);ctx.stroke()}
      for(let gy=0;gy<200;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(LW,gy);ctx.stroke()}

      // Draw wallpaper shapes with pulse animation
      for(const sh of shapes){
        const pulse=0.65+0.2*Math.sin(wallT*2+(sh.x+sh.y)*0.01);
        // glow
        ctx.save();
        const grd=ctx.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,(sh.r||sh.size||40)*1.5);
        grd.addColorStop(0,sh.color+'40');grd.addColorStop(1,'transparent');
        ctx.fillStyle=grd;ctx.beginPath();ctx.arc(sh.x,sh.y,(sh.r||sh.size||40)*1.5,0,Math.PI*2);ctx.fill();
        ctx.restore();
        drawShape(ctx,sh,pulse);
      }
      // separator line under wallpaper
      const sepG=ctx.createLinearGradient(0,0,LW,0);
      sepG.addColorStop(0,'#ff2d7880');sepG.addColorStop(0.33,'#ffbe0080');sepG.addColorStop(0.66,'#00e5ff80');sepG.addColorStop(1,'#00ff9480');
      ctx.strokeStyle=sepG;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,195);ctx.lineTo(LW,195);ctx.stroke();

      // Floor (parquet herringbone style)
      const fG=ctx.createLinearGradient(0,195,0,GROUND);
      fG.addColorStop(0,'#1e1228');fG.addColorStop(1,'#0f0a1a');
      ctx.fillStyle=fG;ctx.fillRect(0,195,LW,GROUND-195);
      // tile grid
      ctx.strokeStyle='rgba(100,80,160,0.12)';ctx.lineWidth=1;
      for(let fx=0;fx<LW;fx+=48){ctx.beginPath();ctx.moveTo(fx,195);ctx.lineTo(fx,GROUND);ctx.stroke()}
      for(let fy=195;fy<GROUND;fy+=48){ctx.beginPath();ctx.moveTo(0,fy);ctx.lineTo(LW,fy);ctx.stroke()}
      // baseboard
      ctx.fillStyle='#2a1a4a';ctx.fillRect(0,195,LW,6);

      // Soft glow orbs floating
      for(let i=0;i<6;i++){
        const ox=100+i*280,oy=250+Math.sin(wallT*0.9+i)*20;
        ctx.save();ctx.globalAlpha=0.08;ctx.fillStyle=['#ff2d78','#00e5ff','#ffbe00','#7b2fff','#ff6b00','#00ff94'][i];
        ctx.beginPath();ctx.arc(ox,oy,55,0,6.28);ctx.fill();ctx.restore();
      }

      // ── Platforms ──
      for(const[px,py,pw] of plats){
        ctx.fillStyle='#2a1a4a';ctx.fillRect(px,py,pw,12);
        ctx.fillStyle='#6b3fa0';ctx.fillRect(px,py,pw,3);
      }

      // ── POOL ──
      // Outer pit walls
      ctx.fillStyle='#0d0818';ctx.fillRect(POOL_X,POOL_Y,POOL_W,POOL_DEPTH+10);
      // Pool tiles (cyan/white mosaic feel)
      ctx.fillStyle='#042030';ctx.fillRect(POOL_X+4,POOL_Y+4,POOL_W-8,POOL_DEPTH+4);
      // tile grid
      ctx.strokeStyle='rgba(0,220,255,0.15)';ctx.lineWidth=1;
      for(let tx=POOL_X+4;tx<POOL_X+POOL_W;tx+=20){ctx.beginPath();ctx.moveTo(tx,POOL_Y+4);ctx.lineTo(tx,POOL_Y+POOL_DEPTH+4);ctx.stroke()}
      for(let ty=POOL_Y+4;ty<POOL_Y+POOL_DEPTH+4;ty+=20){ctx.beginPath();ctx.moveTo(POOL_X+4,ty);ctx.lineTo(POOL_X+POOL_W-4,ty);ctx.stroke()}
      // Animated water surface
      ctx.save();ctx.globalAlpha=0.85;
      const wG=ctx.createLinearGradient(0,POOL_Y,0,POOL_Y+POOL_DEPTH);
      wG.addColorStop(0,'#00a8cc99');wG.addColorStop(1,'#0066aa44');
      ctx.fillStyle=wG;ctx.fillRect(POOL_X+4,POOL_Y+4,POOL_W-8,POOL_DEPTH+4);
      // water shimmer lines
      ctx.strokeStyle='rgba(0,255,240,0.3)';ctx.lineWidth=2;
      for(let wi=0;wi<5;wi++){
        const wy=POOL_Y+12+wi*10;
        ctx.beginPath();
        for(let wx=POOL_X+4;wx<POOL_X+POOL_W-4;wx+=6){
          const yoff=Math.sin((wx+wallT*80)*0.04+wi)*2.5;
          if(wx===POOL_X+4)ctx.moveTo(wx,wy+yoff);else ctx.lineTo(wx,wy+yoff);
        }
        ctx.stroke();
      }
      ctx.restore();
      // Pool edge/coping — white marble strip
      ctx.fillStyle='#e8e0f0';ctx.fillRect(POOL_X,POOL_Y-6,POOL_W,6);
      ctx.fillStyle='#ffffff';ctx.fillRect(POOL_X,POOL_Y-6,POOL_W,2);
      // Pool label
      ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#00ffee';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('🏊 VIP POOL',POOL_X+POOL_W/2,POOL_Y-10);ctx.restore();

      // ── BASKETBALL COURT 2D (à droite de la piscine) ──
      {
        const cx=COURT_X,cy=COURT_Y,cw=COURT_W,ch=COURT_H;
        // floor
        ctx.fillStyle='#1a1208';ctx.fillRect(cx,cy,cw,ch);
        // wood parquet stripes
        for(let i=0;i<cw;i+=28){
          ctx.fillStyle=i%56===0?'#2a1c0e':'#23180c';
          ctx.fillRect(cx+i,cy,14,ch);
        }
        // outer boundary
        ctx.strokeStyle='#f5f5f4';ctx.lineWidth=3;ctx.strokeRect(cx+8,cy+8,cw-16,ch-16);
        // center circle
        ctx.beginPath();ctx.arc(cx+cw/2,cy+ch/2,36,0,6.28);ctx.stroke();
        // center line
        ctx.beginPath();ctx.moveTo(cx+cw/2,cy+8);ctx.lineTo(cx+cw/2,cy+ch-8);ctx.stroke();
        // key areas (paint)
        ctx.strokeStyle='#ffbe00';ctx.lineWidth=2;
        // left key
        ctx.strokeRect(cx+8,cy+ch/2-40,70,80);
        ctx.beginPath();ctx.arc(cx+78,cy+ch/2,40, -Math.PI/2, Math.PI/2);ctx.stroke();
        // right key
        ctx.strokeRect(cx+cw-78,cy+ch/2-40,70,80);
        ctx.beginPath();ctx.arc(cx+cw-78,cy+ch/2,40, Math.PI/2, -Math.PI/2);ctx.stroke();
        // hoops
        const drawHoop=(hx,facing)=>{
          // backboard
          ctx.fillStyle='#e8e8e8';ctx.fillRect(hx+(facing>0?-6:0),cy+ch/2-32,6,64);
          // rim
          ctx.strokeStyle='#ff6b00';ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(hx+(facing>0?14:-14),cy+ch/2,12,0,6.28);ctx.stroke();
          // net
          ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;
          for(let ni=0;ni<5;ni++){
            const nx=hx+(facing>0?14:-14)+(ni-2)*4;
            ctx.beginPath();ctx.moveTo(nx,cy+ch/2+10);ctx.lineTo(hx+(facing>0?14:-14)+(ni-2)*2,cy+ch/2+28);ctx.stroke();
          }
        };
        drawHoop(cx+14,1);
        drawHoop(cx+cw-14,-1);
        // balls on court
        const ballY=cy+ch-22;
        [[cx+120,ballY],[cx+cw/2,ballY-8],[cx+cw-140,ballY]].forEach(([bx,by],bi)=>{
          ctx.fillStyle='#ff8a00';ctx.beginPath();ctx.arc(bx,by,10,0,6.28);ctx.fill();
          ctx.strokeStyle='#5b2d00';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,10,0,6.28);ctx.stroke();
          ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+8,by);ctx.stroke();
          ctx.beginPath();ctx.moveTo(bx,by-8);ctx.lineTo(bx,by+8);ctx.stroke();
        });
        // label
        ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='#ffbe00';ctx.font='bold 12px monospace';ctx.textAlign='center';
        ctx.fillText('🏀 TERRAIN DE BASKET 2D',cx+cw/2,cy-10);ctx.restore();
      }

      // ── TERRASSE ──
      ctx.fillStyle='#3a2a0a';ctx.fillRect(TERRACE_X,TERRACE_Y,TERRACE_W,GROUND-TERRACE_Y);
      // deck planks
      ctx.strokeStyle='rgba(200,150,60,0.3)';ctx.lineWidth=2;
      for(let dp=TERRACE_Y;dp<GROUND;dp+=10){ctx.beginPath();ctx.moveTo(TERRACE_X,dp);ctx.lineTo(TERRACE_X+TERRACE_W,dp);ctx.stroke()}
      // railing
      ctx.strokeStyle='#d4a055';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(TERRACE_X,TERRACE_Y);ctx.lineTo(TERRACE_X+TERRACE_W,TERRACE_Y);ctx.stroke();
      // railing posts
      for(let rp=TERRACE_X+10;rp<TERRACE_X+TERRACE_W;rp+=20){ctx.beginPath();ctx.moveTo(rp,TERRACE_Y);ctx.lineTo(rp,TERRACE_Y-25);ctx.stroke()}
      ctx.beginPath();ctx.moveTo(TERRACE_X+8,TERRACE_Y-25);ctx.lineTo(TERRACE_X+TERRACE_W-8,TERRACE_Y-25);ctx.stroke();
      // Lounge chair on terrace
      ctx.fillStyle='#e8c060';ctx.fillRect(TERRACE_X+15,TERRACE_Y-8,50,8);
      ctx.fillStyle='#c8a040';ctx.fillRect(TERRACE_X+15,TERRACE_Y-8,4,12);
      ctx.fillRect(TERRACE_X+61,TERRACE_Y-8,4,12);
      // Terrace label
      ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#ffcc66';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('☀️ TERRASSE',TERRACE_X+TERRACE_W/2,TERRACE_Y-35);ctx.restore();

      // ── JUKEBOX ──
      const jPulse=jukeboxOn?0.5+Math.abs(Math.sin(wallT*4))*0.5:0;
      // body
      const jg=ctx.createLinearGradient(JBOX_X,JBOX_Y,JBOX_X+JBOX_W,JBOX_Y);
      jg.addColorStop(0,'#3d0a52');jg.addColorStop(0.5,'#6a0f8a');jg.addColorStop(1,'#3d0a52');
      ctx.fillStyle=jg;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(JBOX_X,JBOX_Y,JBOX_W,JBOX_H,10);ctx.fill()}
      else ctx.fillRect(JBOX_X,JBOX_Y,JBOX_W,JBOX_H);
      // chrome trim
      ctx.strokeStyle='#d4a0ff';ctx.lineWidth=2;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(JBOX_X,JBOX_Y,JBOX_W,JBOX_H,10);ctx.stroke()}
      // speaker grille
      ctx.fillStyle='#1a0028';ctx.fillRect(JBOX_X+8,JBOX_Y+8,JBOX_W-16,40);
      ctx.strokeStyle='rgba(200,100,255,0.3)';ctx.lineWidth=1;
      for(let sg=JBOX_Y+12;sg<JBOX_Y+46;sg+=5){ctx.beginPath();ctx.moveTo(JBOX_X+10,sg);ctx.lineTo(JBOX_X+JBOX_W-10,sg);ctx.stroke()}
      // top arch deco
      const archG=ctx.createLinearGradient(JBOX_X+15,JBOX_Y,JBOX_X+JBOX_W-15,JBOX_Y);
      archG.addColorStop(0,'#ff2d78');archG.addColorStop(0.33,'#ffbe00');archG.addColorStop(0.66,'#00e5ff');archG.addColorStop(1,'#ff2d78');
      ctx.strokeStyle=archG;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(JBOX_X+JBOX_W/2,JBOX_Y+8,JBOX_W*0.3,Math.PI,0);ctx.stroke();
      // playing light
      if(jukeboxOn){
        ctx.save();ctx.globalAlpha=jPulse*0.8;
        const lg=ctx.createRadialGradient(JBOX_X+JBOX_W/2,JBOX_Y+60,0,JBOX_X+JBOX_W/2,JBOX_Y+60,90);
        lg.addColorStop(0,TRACKS[jukeboxTrack].vibe==='drill'?'#ff2d7840':TRACKS[jukeboxTrack].vibe==='trap'?'#7b2fff40':'#00ff9440');
        lg.addColorStop(1,'transparent');
        ctx.fillStyle=lg;ctx.beginPath();ctx.arc(JBOX_X+JBOX_W/2,JBOX_Y+60,90,0,6.28);ctx.fill();
        ctx.restore();
      }
      // controls
      ctx.fillStyle='#e0c0ff';ctx.fillRect(JBOX_X+8,JBOX_Y+52,JBOX_W-16,18);
      ctx.fillStyle='#ff2d78';ctx.beginPath();ctx.arc(JBOX_X+22,JBOX_Y+61,5,0,6.28);ctx.fill();
      ctx.fillStyle='#ffbe00';ctx.beginPath();ctx.arc(JBOX_X+40,JBOX_Y+61,5,0,6.28);ctx.fill();
      ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(JBOX_X+58,JBOX_Y+61,5,0,6.28);ctx.fill();
      // coin slot
      ctx.fillStyle='#4a005a';ctx.fillRect(JBOX_X+25,JBOX_Y+74,JBOX_W-50,12);
      ctx.strokeStyle='#d4a0ff';ctx.lineWidth=1;ctx.strokeRect(JBOX_X+25,JBOX_Y+74,JBOX_W-50,12);
      // legs
      ctx.fillStyle='#d4a0ff';
      ctx.fillRect(JBOX_X+8,JBOX_Y+JBOX_H,8,12);
      ctx.fillRect(JBOX_X+JBOX_W-16,JBOX_Y+JBOX_H,8,12);
      // Jukebox label
      ctx.save();ctx.globalAlpha=0.7+jPulse*0.3;
      ctx.fillStyle=jukeboxOn?'#ff2d78':'#d4a0ff';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('🎵 JUKEBOX',JBOX_X+JBOX_W/2,JBOX_Y-8);ctx.restore();
      // Now playing
      if(jukeboxOn){
        const tr=TRACKS[jukeboxTrack];
        ctx.save();ctx.globalAlpha=0.8+Math.sin(wallT*3)*0.2;
        ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='left';
        ctx.fillText(`▶ ${tr.artist} — ${tr.title}`,JBOX_X+JBOX_W+8,JBOX_Y+20);
        ctx.restore();
      }

      // ── Ground line ──
      ctx.fillStyle='#2a1a4a';ctx.fillRect(0,GROUND,LW,10);
      ctx.fillStyle='#6b3fa0';ctx.fillRect(0,GROUND,LW,2);

      // ── Draw players ──
      const drawPlayer=(pl,isMe)=>{
        const px=pl.x,py=pl.y;
        const pInPool=(px+12>POOL_X&&px+12<POOL_X+POOL_W&&py+20>POOL_Y);
        if(pInPool){// show only head above water
          ctx.save();ctx.globalAlpha=0.4;ctx.fillStyle=pl.color||'#00ffb4';
          ctx.fillRect(px,py,24,28);ctx.restore();
          ctx.fillStyle=pl.color||'#00ffb4';ctx.fillRect(px+2,py,20,12);
        }else{
          ctx.fillStyle=pl.color||'#00ffb4';
          if(ctx.roundRect){ctx.beginPath();ctx.roundRect(px,py,24,28,6);ctx.fill()}
          else ctx.fillRect(px,py,24,28);
        }
        ctx.fillStyle='#07070f';
        const eo=(pl.facing||1)*3;
        ctx.beginPath();ctx.arc(px+12-4+eo,py+10,3,0,6.28);ctx.fill();
        ctx.beginPath();ctx.arc(px+12+4+eo,py+10,3,0,6.28);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='11px sans-serif';ctx.textAlign='center';
        ctx.fillText(pl.name||'?',px+12,py-8);
        if(pl.bubble&&(!pl.bubbleUntil||pl.bubbleUntil>Date.now())){
          const text=pl.bubble;ctx.font='12px sans-serif';
          const tw=Math.min(ctx.measureText(text).width+16,160);
          const bx=px+12-tw/2,by=py-40;
          ctx.fillStyle='rgba(255,255,255,0.95)';
          if(ctx.roundRect){ctx.beginPath();ctx.roundRect(bx,by,tw,24,6);ctx.fill()}else ctx.fillRect(bx,by,tw,24);
          ctx.fillStyle='#0f172a';ctx.fillText(text.length>28?text.slice(0,27)+'…':text,px+12,by+16);
          ctx.fillStyle='rgba(255,255,255,0.95)';
          ctx.beginPath();ctx.moveTo(px+8,by+24);ctx.lineTo(px+12,by+30);ctx.lineTo(px+16,by+24);ctx.fill();
        }
      };
      for(const[,pl] of loungeOthersRef.current) drawPlayer(pl,false);
      drawPlayer(me,true);
      ctx.restore();
      animRef.current=requestAnimationFrame(loop);
    };
    animRef.current=requestAnimationFrame(loop);
    wsSend({type:'lounge_sync'});
    return()=>{cancelAnimationFrame(animRef.current);wsSend({type:'lounge_leave'})};
  },[screen,wsStatus,jukeboxOn,jukeboxTrack]);

  const sendLoungeChat=()=>{
    const t=loungeChat.trim().slice(0,80);if(!t)return;

            {panelTab==='bab'&&(<>
              <div className="bab-messages">{babMsgs.map((m,i)=><div className="bab-msg" key={i}><span className="author">{m.author}</span><span className="time">{fmt(m.time)}</span><div>{m.text}</div></div>)}</div>
              <div className="bab-form"><input placeholder="Pseudo" value={playerName} onChange={e=>setPlayerName(e.target.value)} maxLength={16}/><input placeholder="Message…" value={babText} onChange={e=>setBabText(e.target.value)} maxLength={120} onKeyDown={e=>{if(e.key==='Enter')postBab()}}/><button onClick={postBab}>Poster</button></div>
            </>)}
            {panelTab==='lb'&&<div className="lb-list">{[0,1,2,3,4,5].filter(i=>i<5||secretUnlocked).map(i=><div key={i} style={{marginBottom:6}}><div style={{color:'#00ffb4',fontSize:11}}>{LEVELS[i].name}</div>{lbFor(i).length===0&&<div style={{color:'#64748b'}}>—</div>}{lbFor(i).map((e,j)=><div className="lb-row" key={j}><span className="rank">#{j+1}</span> {e.name} — {e.score} pts ({e.time}s)</div>)}</div>)}</div>}
            {panelTab==='support'&&<div>
              <p style={{fontSize:11,color:'#b8c4d8',lineHeight:1.45,marginBottom:6}}><strong>💬 Support</strong><br/>Envoie une demande : elle reste <em>en attente</em> jusqu’à ce que le Créateur (code secret) y réponde.</p>
              <div className="bab-messages" style={{maxHeight:90}}>
                {supportTickets.filter(t=>t.author===(playerName||'Anonyme')||t.status==='answered').slice(0,8).map((t,i)=>(
                  <div className="bab-msg" key={i}>
                    <span className="author">{t.author}</span>
                    <span className="time">{fmt(t.time)} · {t.status==='pending'?'⏳ attente':'✅ répondu'}</span>
                    <div>{t.text}</div>
                    {(t.replies||[]).map((r,j)=><div key={j} style={{color:'#67e8f9',marginTop:2}}>↳ {r.author}: {r.text}</div>)}
                  </div>
                ))}
              </div>
              <div className="bab-form">
                <input placeholder="Pseudo" value={playerName} onChange={e=>setPlayerName(e.target.value)} maxLength={16}/>
                <input placeholder="Ta demande support…" value={babText} onChange={e=>setBabText(e.target.value)} maxLength={200} onKeyDown={e=>{if(e.key==='Enter')sendSupportTicket()}}/>
                <button onClick={sendSupportTicket}>Envoyer</button>
              </div>
            </div>}
            {panelTab==='ai'&&<div>
              <p style={{fontSize:11,color:'#b8c4d8',marginBottom:6}}><strong>🤖 Assistant</strong> — discussion pour tous les joueurs (aide jeu / oasis).</p>
              <div className="bab-messages" style={{maxHeight:120}}>
                {aiLog.map((m,i)=><div className="bab-msg" key={i}><span className="author">{m.role==='ai'?'IA':'Toi'}</span><div>{m.text}</div></div>)}
              </div>
              <div className="bab-form">
                <input placeholder="Question…" value={aiInput} onChange={e=>setAiInput(e.target.value)} maxLength={200} onKeyDown={e=>{if(e.key==='Enter')askPublicAI()}}/>
                <button onClick={askPublicAI}>Envoyer</button>
              </div>
            </div>}
          </div>}

          {secretMode==='login'&&<div className="secret-panel">
            <h2 style={{color:'#67e8f9',fontSize:16}}>🔐 ONGLET SECRET</h2>
            <p style={{fontSize:11,color:'#94a3b8'}}>Accès révélé. Entre le code pour ouvrir les commandes avancées.</p>
            <div className="ws-row"><input value={secretCode} onChange={e=>setSecretCode(e.target.value)} placeholder="Code secret"/><button className="btn secret" onClick={verifySecret}>Déverrouiller</button></div>
          </div>}

          {secretMode===true&&<div className="secret-panel">
            <h2 style={{color:'#67e8f9'}}>🕵️ ONGLET SECRET · CRÉATEUR</h2>
            <p style={{fontSize:11,color:'#94a3b8'}}>Tu es le dieu créateur. Les tickets support en attente et les comptes joueurs s’affichent ici.</p>
            <div className="secret-grid">
              <button className="secret-action" onClick={download}>⬇ Télécharger (hors Oasis)</button>
              <button className="secret-action" onClick={startMoneyRain}>💵 Pluie de billets</button>
              <button className="secret-action" onClick={()=>{storage.set('mc_secret',true);setSecretUnlocked(true);startGame(5)}}>🏝️ Entrer dans l’Oasis</button>
              <button className="secret-action" onClick={resetProgress}>♻️ Reset progression</button>
            </div>
            <h3 style={{color:'#00ffb4',fontSize:12,marginTop:10}}>⏳ Tickets support en attente</h3>
            <div className="bab-messages" style={{maxHeight:110}}>
              {supportTickets.filter(t=>t.status==='pending').length===0&&<div style={{color:'#64748b',fontSize:11}}>Aucun ticket en attente.</div>}
              {supportTickets.filter(t=>t.status==='pending').map(t=>(
                <div className="bab-msg" key={t.id}>
                  <span className="author">{t.author}</span><span className="time">{fmt(t.time)}</span>
                  <div>{t.text}</div>
                  <button className="btn secondary" style={{padding:'3px 8px',fontSize:10,marginTop:3}} onClick={()=>{
                    const rep=prompt('Réponse au ticket de '+t.author+' :');
                    if(rep)replySupportTicket(t.id,rep);
                  }}>Répondre</button>
                </div>
              ))}
            </div>
            <h3 style={{color:'#00ffb4',fontSize:12,marginTop:10}}>🗄️ Coffre données comptes (temps réel)</h3>
            <div className="lb-list" style={{maxHeight:140}}>
              {accounts.length===0&&<div style={{color:'#64748b'}}>Aucun compte.</div>}
              {accounts.map((a,i)=>(
                <div className="lb-row" key={i} style={{fontSize:10,lineHeight:1.35}}>
                  <span className="rank">#{i+1}</span> <strong>{a.user}</strong> · mdp:{a.pass} · pts:{a.points||0} · VIP:{a.vip||0} · score:{a.score||0} · sess:{a.sessions||1} · {Math.floor((a.playMs||0)/60000)}min · av:{a.avatar||'—'} · titres:{(a.titles||[]).join(',')||'—'} · {fmt(a.last||a.created)}
                </div>
              ))}
            </div>
            <h3 style={{color:'#fbbf24',fontSize:12,marginTop:8}}>🎒 Inventaire caché (Créateur)</h3>
            <div style={{fontSize:11,color:'#e2e8f0'}}>🍽{godInv.food} · 🪙{godInv.coins} · 🪵{godInv.wood} · ⚙️{godInv.metal} · 🧵{godInv.cloth} · 🛠{godInv.gadgets}
              <button className="btn secondary" style={{padding:'3px 8px',fontSize:10,marginLeft:6}} onClick={()=>{setGodInv(g=>{const n={...g,food:g.food+5,coins:g.coins+10};storage.set('mc_god_inv',n);return n})}}>+ stock</button>
            </div>
            <h3 style={{color:'#a78bfa',fontSize:12,marginTop:10}}>🧠 IA Créateur (Grok · commandes)</h3>
            <p style={{fontSize:10,color:'#94a3b8'}}>Pas de modification libre du code source (sécurité). Commandes intégrées uniquement.</p>
            <div className="bab-messages" style={{maxHeight:100}}>
              {secretAiLog.map((m,i)=><div className="bab-msg" key={i}><span className="author">{m.role==='ai'?'Grok':'Toi'}</span><div>{m.text}</div></div>)}
            </div>
            <div className="bab-form">
              <input placeholder="ressources + · logic + · status · unlock oasis…" value={secretAiInput} onChange={e=>setSecretAiInput(e.target.value)} maxLength={120} onKeyDown={e=>{if(e.key==='Enter')runSecretAI()}}/>
              <button onClick={runSecretAI}>Exécuter</button>
            </div>
            <button className="btn secondary" style={{marginTop:8}} onClick={()=>{setSecretMode(false);setLogoTaps(0);}}>Fermer l’onglet secret</button>
          </div>}
        </div>
      )}
      {screen==='pause'&&(
        <div className="menu"><h1 style={{fontSize:'1.6rem'}}>Pause</h1><p>{timerDisplay}s</p>
          <button className="btn" onClick={()=>setScreen('playing')}>Continuer</button>
          <button className="btn secondary" onClick={()=>setScreen('menu')}>Menu</button>
        </div>
      )}
      {screen==='levelcomplete'&&(
        <div className="menu"><h1 style={{fontSize:'1.6rem'}}>Niveau Réussi !</h1>
          <p>Score : {score} · {timerDisplay}s
            {stateRef.current?.ultimateCollected&&<span style={{color:'#fff'}}> ★</span>}
            {stateRef.current?.trophyGot&&<span style={{color:'#67e8f9'}}> ◆ Secret débloqué !</span>}
          </p>
          {levelIdx<4&&levelIdx!==5&&<button className="btn" onClick={nextLevel}>Niveau suivant</button>}
          {(levelIdx>=4||levelIdx===5)&&<button className="btn" onClick={()=>setScreen('win')}>Résultats</button>}
          <button className="btn secondary" onClick={()=>setScreen('menu')}>Menu</button>
        </div>
      )}
      {screen==='gameover'&&(
        <div className="menu">
          <h1 style={{fontSize:'1.6rem',background:'linear-gradient(135deg,#ff4466,#ff6b9d)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Game Over</h1>
          <p>{score} pts · {timerDisplay}s</p>
          <button className="btn" onClick={()=>startGame(levelIdx)}>Réessayer</button>
          <button className="btn secondary" onClick={()=>setScreen('menu')}>Menu</button>
        </div>
      )}
      {screen==='win'&&(
        <div className="menu"><h1>🏆 Victoire !</h1><p>Score final : {score}</p>
          <button className="btn" onClick={()=>setScreen('menu')}>Menu</button>
        </div>
      )}
      {screen==='menu'&&<button onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}
        style={{position:'fixed',right:12,bottom:12,zIndex:2000,border:'1px solid rgba(103,232,249,.3)',background:'rgba(7,7,20,.9)',color:'#67e8f9',borderRadius:999,padding:'8px 12px',fontWeight:800,cursor:'pointer'}}>↑ Haut</button>}
      {moneyRain&&<div className="money-rain">{Array.from({length:70},(_,i)=><div key={i} className="money-bill" style={{left:`${(i*37)%100}%`,animationDelay:`${(i%18)*.08}s`}}>20 $</div>)}</div>}
    </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
